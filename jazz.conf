# Put this file next to JAZZ.EXE and all the game's data files.
[dosbox]
machine=svga_s3
memsize=16
[cpu]
core=dynamic
cycles=9000
[render]
scaler=none
[mixer]
rate=48000
blocksize=1024
prebuffer=25
[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
oplmode=auto
oplemu=default
[gus]
gus=false
[midi]
mididevice=none
[autoexec]
mount c .
c:
jazz.exe
